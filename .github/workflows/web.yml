# Web CI (issue #127, SPEC §16.2).
# install, typecheck, lint, unit tests, build for apps/web (Next.js 15).
# Until apps/web has a package.json the filter matches nothing and each step exits 0.
name: web

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".nvmrc"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".nvmrc"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: typecheck / lint / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # No version input: it reads "packageManager": "pnpm@9.12.0" from package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # The pnpm cache needs a lockfile; skip caching if there isn't one yet.
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}

      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "::warning::No pnpm-lock.yaml yet, installing without --frozen-lockfile"
            pnpm install --no-frozen-lockfile
          fi

      - name: Typecheck
        run: pnpm -r --if-present --filter ./apps/web typecheck

      - name: Lint
        run: pnpm -r --if-present --filter ./apps/web lint

      - name: Unit tests
        run: pnpm -r --if-present --filter ./apps/web test

      # Next's build cache makes repeat builds much faster.
      - uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx', 'apps/web/**/*.css') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      # The build must not need secrets. Anything the app reads at build time
      # needs a safe default in code, not a value injected here.
      - name: Build
        run: pnpm -r --if-present --filter ./apps/web build
