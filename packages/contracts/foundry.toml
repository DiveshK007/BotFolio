# SPEC §0.1/§0.3: QIE mainnet is Shanghai (no Cancun). Do not change evm_version or solc.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
# ./out is read by test/AbiExport.t.sol, which fails CI when abi/ differs from a fresh build.
# assets.ts is read by test/AssetIndex.fork.t.sol, which fails when the asset order differs.
fs_permissions = [
  { access = "read-write", path = "./abi" },
  { access = "read", path = "./out" },
  { access = "read", path = "../shared/src/assets.ts" },
]

[rpc_endpoints]
# rpc1/rpc2 drop TLS sometimes (SPEC §0.1); rpc3 is the default fork RPC. CI falls back to rpc4/rpc5.
qie = "https://rpc3mainnet.qie.digital"
# Local mainnet-fork staging (docs/anvil-fork.md). Testnet staging was dropped Nov 20
# (docs/decisions.md). Nothing in the repo referenced qie_testnet, so that endpoint is gone.
anvil = "http://127.0.0.1:8545"

[fmt]
line_length = 110
